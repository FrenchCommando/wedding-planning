name: wedding-planning

# Standalone: publishes a host port directly and is reached by an nginx
# config running on the Pi itself (see deploy/nginx/wedding-planning.conf).
# No shared Docker network, no dependency on any other stack being up.

services:
  app:
    build: .
    container_name: wedding-planning
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Drive refresh token — created by the one-time OAuth device-grant
      # approval, must be scp'd here by hand, never committed, never
      # regenerated automatically (see CLAUDE.md "First-run setup").
      - ./data:/app/data

# Host nginx server block for the wedding-planning app.
# Drop this into the Pi's nginx sites config (wherever other plain host-nginx
# sites on the Pi live), fill in server_name (domain is private, not
# committed here), then reload nginx (e.g. `sudo nginx -s reload` or your
# distro's nginx service reload).
#
# The app container publishes 127.0.0.1:3000 (see docker-compose.yml) —
# this proxies straight to that, no shared Docker network involved.

server {
    listen 80;
    server_name <FILL:APP_HOST>;   # fill in on the Pi, not in the repo

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

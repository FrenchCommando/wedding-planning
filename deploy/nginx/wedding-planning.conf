# Docker nginx server block for the wedding-planning app.
# Drop this into proxy-auth/auth/nginx/conf.d/ on the Pi as
# wedding-planning.conf, fill in server_name (domain is private, not
# committed here), then reload:
#   docker compose -f auth/compose.yml exec nginx nginx -s reload
#
# No authrequest snippet — this app is deliberately NOT behind Authelia
# (see wedding-planning CLAUDE.md: guest/vendor/editor auth is handled by
# the app's own JWT session, not sysadmin SSO). Pattern mirrors
# auth-portal.conf's bypass-style passthrough, not sample-app.conf.

server {
    listen 80;
    server_name <FILL:APP_HOST>;   # fill in on the Pi, not in the repo

    resolver 127.0.0.11 valid=30s;   # Docker embedded DNS

    set $upstream_app http://wedding-planning:3000;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $upstream_app;
    }
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity — Hanna &amp; Martial Planning</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f6f1e7; --bg2:#efe6d3; --panel:#fffdf8; --ink:#2b2620; --muted:#8a8071;
    --line:#e2d8c3; --accent:#a9744f; --accent-ink:#fff; --danger:#b2483c;
    --shadow:0 1px 2px rgba(60,45,20,.05),0 10px 30px rgba(60,45,20,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1b1712; --bg2:#241f18; --panel:#26221b; --ink:#efe9dc; --muted:#a39a87;
      --line:#3a3428; --accent:#c99361; --accent-ink:#20160c; --danger:#e0685c;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);background:radial-gradient(ellipse at top,var(--bg2),var(--bg));padding:40px 20px 80px;
  }
  #app{width:100%;max-width:820px;margin:0 auto;}
  h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:26px;font-weight:400;margin:0 0 2px;}
  .sub{color:var(--muted);margin-bottom:28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
  a.back{color:var(--muted);text-decoration:none;font-size:13px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow);}
  .card h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600;}
  input,button,select{font:inherit;}
  input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--panel);color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  button{padding:8px 14px;border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  button:hover{opacity:.88;}
  button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400;}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .controls input{flex:1;min-width:160px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  tr:last-child td{border-bottom:0;}
  .when{color:var(--muted);white-space:nowrap;}
  .actor{font-weight:600;}
  .detail{color:var(--muted);}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);}
  .tag.login{background:transparent;}
  .tag.save{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .tag.fail{color:var(--danger);border-color:var(--danger);}
  .empty{color:var(--muted);text-align:center;padding:24px 0;}
  .denied{text-align:center;color:var(--muted);padding:60px 20px;}
  .count{color:var(--muted);font-size:12px;}
  @media (max-width:560px){ .hide-sm{display:none;} }
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
async function api(path, opts) {
  return fetch("/api" + path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function fmtWhen(iso){
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString(undefined, {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}

function tagClass(action){
  if (action.endsWith("failed")) return "fail";
  if (action === "save") return "save";
  return "login";
}

let allEntries = [];

function render(entries){
  if (!entries.length) return `<p class="empty">Nothing logged yet.</p>`;
  const rows = entries.map(e => `
    <tr>
      <td class="when">${fmtWhen(e.at)}</td>
      <td class="actor">${esc(e.actor)}</td>
      <td><span class="tag ${tagClass(e.action)}">${esc(e.action)}</span></td>
      <td class="hide-sm">${esc(e.target)}</td>
      <td class="detail hide-sm">${esc(e.detail)}</td>
    </tr>`).join("");
  return `<table><thead><tr>
      <th>When</th><th>Who</th><th>Did</th><th class="hide-sm">What</th><th class="hide-sm">Detail</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

function applyFilter(){
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const kind = document.getElementById("kind").value;
  const filtered = allEntries.filter(e => {
    if (kind === "logins" && !e.action.startsWith("login")) return false;
    if (kind === "saves" && e.action !== "save") return false;
    if (kind === "failures" && !e.action.endsWith("failed")) return false;
    if (!q) return true;
    return (e.actor + " " + e.action + " " + e.target + " " + e.detail).toLowerCase().includes(q);
  });
  document.getElementById("tableBox").innerHTML = render(filtered);
  document.getElementById("count").textContent =
    `${filtered.length} of ${allEntries.length} ${allEntries.length === 1 ? "entry" : "entries"}`;
}

async function refresh(){
  const box = document.getElementById("tableBox");
  box.innerHTML = `<p class="empty">Loading…</p>`;
  try {
    const res = await api("/admin/activity");
    if (!res.ok) throw new Error("failed");
    allEntries = (await res.json()).entries;
    applyFilter();
  } catch {
    box.innerHTML = `<p class="empty">Couldn't load the activity log — try reloading.</p>`;
  }
}

function renderPage(){
  document.getElementById("app").innerHTML = `
    <a class="back" href="/">&larr; Home</a>
    <h1>Activity</h1>
    <div class="sub">Who opened what, and who changed what</div>

    <div class="card">
      <div class="controls">
        <input id="filter" placeholder="Filter by name, household, page…" autocomplete="off">
        <select id="kind">
          <option value="all">Everything</option>
          <option value="logins">Logins</option>
          <option value="saves">Saves</option>
          <option value="failures">Failed attempts</option>
        </select>
        <button class="secondary" id="refreshBtn">Refresh</button>
      </div>
      <div id="tableBox"><p class="empty">Loading…</p></div>
      <p class="count" id="count"></p>
    </div>
  `;
  document.getElementById("filter").addEventListener("input", applyFilter);
  document.getElementById("kind").addEventListener("change", applyFilter);
  document.getElementById("refreshBtn").addEventListener("click", refresh);
  refresh();
}

function renderDenied(){
  document.getElementById("app").innerHTML = `
    <div class="denied">
      <p>Editor login required.</p>
      <p><a class="back" href="/">&larr; Back to home</a></p>
    </div>`;
}

async function init(){
  const res = await api("/whoami");
  const body = await res.json();
  if (body.session && body.session.role === "editor") renderPage();
  else renderDenied();
}
init();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceremony</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f6f1e7; --panel:#fffdf8; --ink:#2b2620; --muted:#8a8071;
    --line:#e2d8c3; --accent:#a9744f; --accent-ink:#fff; --danger:#b2483c;
    --shadow:0 1px 2px rgba(60,45,20,.05),0 10px 30px rgba(60,45,20,.08);
    /* Timeline rail geometry — one set of variables driving the gutter,
       the line, the dot, and the time column, so the whole rail can shrink
       together on narrow screens instead of each piece drifting apart. */
    --gutter:100px; --line-x:70px; --dot-x:65px; --time-w:60px;
  }
  @media (max-width:520px){
    :root{ --gutter:72px; --line-x:52px; --dot-x:46px; --time-w:42px; }
    .moment .time{font-size:11px;}
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1b1712; --panel:#26221b; --ink:#efe9dc; --muted:#a39a87;
      --line:#3a3428; --accent:#c99361; --accent-ink:#20160c; --danger:#e0685c;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  /* Bottom padding must be viewport-relative, not a fixed px value — the
     page needs enough trailing scroll room for the very last element
     ("End") to reach the top of the viewport on any screen size. */
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:40px 20px 100vh;background:var(--bg);color:var(--ink);}
  h1{text-align:center;font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:400;font-size:28px;margin:0 0 4px;}
  .sub{text-align:center;color:var(--muted);margin-bottom:60px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
  .topbar{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto 20px;}
  .topbar a{color:var(--muted);text-decoration:none;font-size:13px;}
  button{padding:7px 14px;border:none;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;cursor:pointer;}
  button.secondary{background:transparent;color:inherit;border:1px solid var(--line);font-weight:400;}
  button.danger{background:var(--danger);color:#fff;}

  .timeline{max-width:640px;margin:0 auto;position:relative;}
  .timeline::before{content:"";position:absolute;left:var(--line-x);top:0;bottom:0;width:2px;background:var(--line);}
  .moment{position:relative;padding:0 0 44px var(--gutter);opacity:0;transform:translateY(24px);transition:opacity .6s ease, transform .6s ease;}
  .moment.visible{opacity:1;transform:none;}
  .moment .time{position:absolute;left:0;top:2px;width:var(--time-w);text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .moment .dot{position:absolute;left:var(--dot-x);top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg);}
  .moment h2{font-size:18px;margin:0 0 6px;font-weight:600;}
  /* Rail header (time/dot/h2) for the processional/recessional moment —
     same element, same position, never restyled. It just additionally
     becomes sticky so it's the thing that stays pinned at the top for the
     whole aisle pin. The negative-margin/padding pair re-creates .moment's
     own coordinate space for this element (since sticky makes it the new
     positioned ancestor for the absolute .time/.dot inside it) so they land
     in exactly the same visual spot as an ordinary, non-pinned moment. */
  .rail-sticky{position:sticky;top:0;z-index:2;background:var(--bg);margin-left:calc(-1 * var(--gutter));padding:24px 0 0 var(--gutter);min-height:30px;}
  /* .time/.dot are position:absolute, so they're positioned against the
     ancestor's padding-box edge — which sits right after the border,
     UNAFFECTED by how much padding-top the ancestor itself has (padding is
     drawn inside that box). rail-sticky's own padding-top:24px therefore
     pushes the h2 (normal flow) down but leaves .time/.dot exactly where
     they'd be with no padding at all — hence the misalignment. Shifting
     their `top` by the same 24px keeps everything on one visual row. */
  .rail-sticky .time{top:26px;}
  .rail-sticky .dot{top:30px;}
  .moment p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;}
  /* .dot is position:absolute, so it ignores this element's own
     padding-top (same reason .rail-sticky needed a matching offset) —
     shift it down by the same amount so it stays aligned with "End". */
  .end-of-timeline{padding-top:20px;}
  .end-of-timeline .dot{top:26px;}
  .moment .participants{margin-top:8px;font-size:12px;color:var(--accent);}

  /* Aisle diagram: a VERTICAL path from Entrance (top) to Altar (bottom) —
     matches the page's own scroll direction. Each person is a marker whose
     position is driven directly by scroll offset (scroll-linked, not a
     timed autoplay), computed in JS via updateAislePositions().

     While the walk is in progress, the page itself pins in place (sticky)
     and the extra scroll distance in .aisle-pin-spacer drives the walkers
     instead of scrolling the page — like the "outside freezes, inside
     advances" of a scrollytelling section — then releases normally once
     the walk finishes. */
  .aisle-pin-spacer{position:relative;}
  /* Fills the whole viewport while pinned — this is what actually makes
     "outside" content unable to peek through above or below; a sticky box
     smaller than the viewport lets neighboring content show at the same
     time, which defeats the freeze. */
  /* No forced height:100vh — the spacer (sized in JS) already reserves
     enough scroll distance to keep the next moment off-screen regardless
     of how tall this box actually renders; forcing full-viewport height
     just left a big empty same-color gap under short content. */
  .aisle-pin-sticky{position:sticky;top:0;padding:8px 0 24px;background:var(--bg);}
  .aisle-wrap{margin:0 auto;width:100%;max-width:480px;}
  .aisle{position:relative;width:100%;height:min(30vh,260px);margin:0 auto;}
  .aisle::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:3px;background:repeating-linear-gradient(180deg,var(--line) 0 8px,transparent 8px 16px);}
  .aisle .endpoint{position:absolute;left:46px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  /* Altar is the destination people walk UP toward, so it sits at the top
     of the track; Entrance (where they start) is at the bottom. */
  .aisle .endpoint.start{bottom:-2px;}
  .aisle .endpoint.end{top:-2px;}
  .aisle .walker{position:absolute;left:6px;top:0;font-size:22px;will-change:transform,opacity;}
  .aisle-timeline{list-style:none;margin:14px 0 0;padding:0;font-size:13px;}
  .aisle-timeline li{display:flex;gap:10px;padding:5px 0;color:var(--muted);opacity:.4;transition:opacity .3s;}
  .aisle-timeline li.active{opacity:1;color:var(--ink);}
  .aisle-timeline .t{width:44px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;}
  .aisle-timeline .role{color:var(--muted);font-size:11px;margin-left:6px;}

  .editRow{position:relative;padding:0 0 20px var(--gutter);}
  .editRow input,.editRow textarea{display:block;width:100%;margin-bottom:6px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font-size:14px;font-family:inherit;}
  .editRow textarea{resize:vertical;min-height:44px;}
  .editRow .rowbar{display:flex;gap:8px;margin-top:6px;}
  .editRow .time-input{width:80px;position:absolute;left:0;top:0;}

  .procEditRow{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .procEditRow input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font-size:13px;font-family:inherit;}
  .procEditRow .p-emoji{width:64px;text-align:center;}
  .procEditRow .p-name{flex:2;}
  .procEditRow .p-role{flex:2;}
  .procEditRow .p-start{width:70px;}
  .procEditRow button{width:auto;padding:5px 9px;}

  .tabs{max-width:640px;margin:0 auto 24px;display:flex;gap:8px;justify-content:center;}
  .tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  .speechRow{max-width:640px;margin:0 auto 18px;padding:0 0 18px;border-bottom:1px solid var(--line);}
  .speechRow:last-child{border-bottom:0;}
  .speechRow h2{font-size:16px;margin:0 0 2px;font-weight:600;}
  .speechRow .relation{font-size:12px;color:var(--accent);margin-bottom:4px;}
  .speechRow p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;}

  .speechEditRow{max-width:640px;margin:0 auto 12px;}
  .speechEditRow input,.speechEditRow textarea{display:block;width:100%;margin-bottom:6px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font-size:14px;font-family:inherit;}
  .speechEditRow textarea{resize:vertical;min-height:44px;}
  .speechEditRow .rowbar{display:flex;gap:8px;margin-top:6px;}
  .speechEditRow .rowbar button{width:auto;padding:5px 9px;}

  .scriptRow{max-width:640px;margin:0 auto 22px;padding:0 0 22px;border-bottom:1px solid var(--line);}
  .scriptRow:last-child{border-bottom:0;}
  .scriptRow h2{font-size:16px;margin:0 0 8px;font-weight:600;}
  .scriptRow p{margin:0;color:var(--ink);font-size:14px;line-height:1.7;white-space:pre-wrap;}
  .scriptRow p.empty{color:var(--muted);font-style:italic;}

  .scriptEditRow{max-width:640px;margin:0 auto 14px;}
  .scriptEditRow input{display:block;width:100%;margin-bottom:6px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font-size:14px;font-weight:600;font-family:inherit;}
  .scriptEditRow textarea{display:block;width:100%;margin-bottom:6px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font-size:14px;line-height:1.6;font-family:inherit;resize:vertical;min-height:140px;}
  .scriptEditRow .rowbar{display:flex;gap:8px;margin-top:6px;}
  .scriptEditRow .rowbar button{width:auto;padding:5px 9px;}

  .addBar{max-width:640px;margin:20px auto;text-align:center;}
  #err{color:var(--danger);text-align:center;margin-bottom:20px;}

  .overlay{position:fixed;inset:0;background:rgba(20,16,10,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 20px;}
  .overlay[hidden]{display:none;}
  .overlay-card{background:var(--panel);max-width:520px;width:100%;max-height:88vh;overflow:auto;border-radius:14px;box-shadow:var(--shadow);padding:20px 24px 24px;}
  .overlay-card h2{margin:0 0 4px;font-size:18px;}
  .overlay-card .lead{color:var(--muted);margin:0 0 12px;font-size:13px;}
  .overlay-close{float:right;border:1px solid var(--line);background:transparent;border-radius:8px;width:28px;height:28px;padding:0;cursor:pointer;font-size:15px;line-height:1;}
  .hist-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .hist-row:last-child{border-bottom:0;}
  .hist-when{flex:1;font-size:13px;}
  .hist-empty{color:var(--muted);font-size:13px;padding:6px 0;}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">&larr; Home</a>
  <span id="roleTag" style="font-size:12px;opacity:.6"></span>
  <span id="editControls" style="display:none"><button class="secondary" id="editToggle">Edit</button></span>
  <button class="secondary" id="historyBtn" style="display:none">History</button>
</div>
<div class="overlay" id="history" hidden>
  <div class="overlay-card">
    <button class="overlay-close" id="historyClose" title="Close">×</button>
    <h2>Past saves</h2>
    <p class="lead">Each save keeps a Drive revision. Pick one to see what changed since then. Regular saves can age out of Drive's history over time.</p>
    <div id="historyList"></div>
  </div>
</div>
<h1>Ceremony</h1>
<div class="sub" id="subTitle"></div>
<div id="err"></div>
<div class="tabs">
  <button id="tabTimeline" class="active">Timeline</button>
  <button id="tabSpeeches">Speeches</button>
  <button id="tabScript">Script</button>
</div>
<div class="timeline" id="timeline"></div>
<div id="speeches" style="display:none"></div>
<div id="script" style="display:none"></div>
<div class="addBar" id="addBar" style="display:none"><button class="secondary" id="addMoment">+ Add moment</button></div>
<div class="addBar" id="addSpeechBar" style="display:none"><button class="secondary" id="addSpeech">+ Add speech</button></div>
<div class="addBar" id="addScriptBar" style="display:none"><button class="secondary" id="addScriptSection">+ Add section</button></div>

<script>
async function api(path,opts){
  return fetch("/api"+path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opts});
}
async function promptForLogin(){
  while(true){
    const password=prompt("Editor password:");
    if(password===null)throw new Error("login cancelled");
    const res=await api("/login/editor",{method:"POST",body:JSON.stringify({password})});
    if(res.ok)return;
    alert("Wrong password — try again.");
  }
}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtRev(rev){const d=new Date(rev||"");if(isNaN(d))return"";return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+", "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});}

let data=null, revisionId=null, editing=false, session=null, activeTab="timeline";
let speechesData=null, speechesRevisionId=null;
let scriptData=null, scriptRevisionId=null;

// Central place mapping a tab name to its API path — every save/history
// call site reads from here instead of repeating its own ternary chain.
const TAB_PATHS={timeline:"/ceremony",speeches:"/speeches",script:"/script"};

async function loadSession(){
  const res=await api("/whoami");
  const body=await res.json();
  session=body.session;
}

async function loadCeremony(){
  let res=await api("/ceremony");
  if(res.status===403){
    await promptForLogin();
    await loadSession();
    res=await api("/ceremony");
  }
  if(!res.ok)throw new Error("failed to load ceremony data");
  const body=await res.json();
  data=body.data;
  revisionId=body.revisionId;
  if(data.recessionalOrder===undefined)data.recessionalOrder=deriveRecessionalFromProcessional();
}

// Own Drive file (speeches.json), own router/history — split out of
// ceremony.json so speeches track/diff independently of the ceremony
// timeline data.
async function loadSpeeches(){
  const res=await api("/speeches");
  if(!res.ok)throw new Error("failed to load speeches data");
  const body=await res.json();
  speechesData=body.data;
  speechesRevisionId=body.revisionId;
}

// Own Drive file (script.json), own router/history — the officiant's actual
// spoken script (long-form section text), split out for the same reason
// speeches is: tracked/diffed/edited independently of the ceremony timeline.
async function loadScript(){
  const res=await api("/script");
  if(!res.ok)throw new Error("failed to load script data");
  const body=await res.json();
  scriptData=body.data;
  scriptRevisionId=body.revisionId;
}

// Moments titled "processional" or "recessional" (case-insensitive) get the
// aisle diagram + timeline. Each has its own independent order/timing list
// (processionalOrder / recessionalOrder) — who exits isn't always just who
// entered in reverse (different pairing, someone leaving early, etc.), so
// this isn't derived, it's edited separately.
function isProcessional(title){return /processional/i.test(title||"")&&!/recessional/i.test(title||"");}
function isRecessional(title){return /recessional/i.test(title||"");}
function fmtOffset(sec){const m=Math.floor(sec/60),s=sec%60;return m?`${m}:${String(s).padStart(2,"0")}`:`0:${String(s).padStart(2,"0")}`;}

// One-time migration for ceremony data saved before recessionalOrder
// existed as its own field: seeds it from the old reverse-of-processional
// computation (preserving the original pacing between people) as a
// starting point, editable independently from then on. Only runs if the
// field is entirely absent — an intentionally empty list (someone cleared
// it) is left alone.
function deriveRecessionalFromProcessional(){
  const sorted=(data.processionalOrder||[]).slice().sort((a,b)=>a.startAt-b.startAt);
  if(!sorted.length)return [];
  const gaps=sorted.slice(1).map((p,i)=>p.startAt-sorted[i].startAt).reverse();
  const reversedPeople=sorted.slice().reverse();
  let cum=0;
  return reversedPeople.map((p,i)=>{
    if(i>0)cum+=gaps[i-1];
    return {...p,id:(data.nextId=(data.nextId||1)+1),startAt:cum};
  });
}

// `startAt`/WALK_DURATION are real planned seconds within the processional
// (the editor's actual pacing), not a playback duration — there's no timer
// or autoplay anywhere here. They only exist to convert into scroll-pixel
// distance (via PIN_PX_PER_SEC below), which is what actually drives motion.
const WALK_DURATION=6; // planned seconds each person takes to walk the aisle

function aisleHTML(order,reverse){
  order=(order||[]).slice().sort((a,b)=>a.startAt-b.startAt);
  if(!order.length)return "";
  const maxStart=Math.max(...order.map(p=>p.startAt));
  const totalDuration=maxStart+WALK_DURATION;

  const walkers=order.map(p=>{
    const emoji=p.emoji||"🚶";
    return `<span class="walker" data-start="${p.startAt}" data-dur="${WALK_DURATION}" data-reverse="${reverse?1:0}" data-id="${p.id}-${reverse?"r":"p"}">${emoji}</span>`;
  }).join("");

  const rows=order.map(p=>`
    <li data-id="${p.id}-${reverse?"r":"p"}">
      <span class="t">${fmtOffset(p.startAt)}</span>
      <span>${esc(p.name)}${p.role?`<span class="role">${esc(p.role)}</span>`:""}</span>
    </li>
  `).join("");

  return `
    <div class="aisle-pin-spacer">
      <div class="aisle-pin-sticky">
        <div class="aisle-body">
          <div class="aisle-wrap" data-total="${totalDuration}">
            <div class="aisle">${walkers}<span class="endpoint start">Entrance</span><span class="endpoint end">Altar</span></div>
            <ul class="aisle-timeline">${rows}</ul>
          </div>
        </div>
      </div>
    </div>
  `;
}

// Scroll-pixels per planned second — the only place real-world "seconds"
// get converted into scroll distance. No timer reads this; it's purely a
// unit conversion used once, when sizing the spacer.
const PIN_PX_PER_SEC=6;

// Sizes each spacer to (sticky content height + walk duration's worth of
// extra scroll). While the spacer's top has scrolled past the viewport top
// but its bottom hasn't yet, position:sticky holds the content in place —
// exactly the window in which the page should read as "frozen".
//
// The diagram's own pin stacks BELOW the rail title's pin (which is a
// separate, independent sticky element right before the spacer, at
// top:0) — so both stay on screen together, the title pinned above the
// diagram, rather than the two competing for the same top:0 spot.
function layoutAislePins(){
  document.querySelectorAll(".aisle-pin-spacer").forEach(spacer=>{
    const sticky=spacer.querySelector(".aisle-pin-sticky");
    const wrap=spacer.querySelector(".aisle-wrap");
    const total=Number(wrap.dataset.total||0);
    const extra=Math.round(total*PIN_PX_PER_SEC);

    const moment=spacer.closest(".moment");
    const railHeader=moment ? moment.querySelector(".rail-sticky") : null;
    const headerHeight=railHeader ? railHeader.offsetHeight : 0;
    sticky.style.top=headerHeight+"px";

    // headerHeight is NOT added here — the rail header is a separate
    // sibling sitting before the spacer in normal flow, so it already
    // reserves its own space; counting it again here would double it.
    //
    // position:sticky only guarantees "nothing else visible at the same
    // time" for as long as its containing block (.moment) stays at least
    // one viewport tall — this is a hard requirement of how sticky works,
    // not a style choice. Below that, the next moment legitimately shows
    // up before the pin finishes. So the spacer must reserve at least a
    // full viewport regardless of how short the content itself is; any
    // shortfall becomes extra scroll distance, not a taller visible box.
    const naturalHeight=sticky.offsetHeight+extra;
    const minHeight=window.innerHeight-headerHeight;
    spacer.style.height=Math.max(naturalHeight,minHeight)+"px";
  });
}

// The CSS padding-bottom is just a "definitely enough" fallback. The exact
// amount needed so max-scroll lands with "End"'s top exactly at the
// viewport top (not past it) depends on End's real height and the actual
// viewport height, so it has to be computed, not a fixed value.
function layoutEndPadding(){
  const endEl=document.querySelector(".end-of-timeline");
  if(!endEl)return;
  const pad=Math.max(0, window.innerHeight-endEl.offsetHeight);
  document.body.style.paddingBottom=pad+"px";
}

// Scroll-linked positioning: progress is how far scroll has moved through
// the spacer's pinned window (0 before pinning starts, 1 after it ends) —
// not how far the diagram itself has moved, since it doesn't move while
// pinned. Scrolling up runs the walk backward. No timers, no autoplay.
// Accounts for the sticky element's own `top` offset (it isn't glued to
// the viewport's literal top edge, so the pin math has to match that).
function pinProgress(spacer, sticky){
  const rect=spacer.getBoundingClientRect();
  const extra=spacer.offsetHeight-sticky.offsetHeight;
  const topOffset=parseFloat(getComputedStyle(sticky).top)||0;
  if(extra<=0)return rect.top<=topOffset?1:0;
  return Math.min(1, Math.max(0, (topOffset-rect.top)/extra));
}

function updateAislePositions(){
  document.querySelectorAll(".aisle-pin-spacer").forEach(spacer=>{
    const sticky=spacer.querySelector(".aisle-pin-sticky");
    const wrap=spacer.querySelector(".aisle-wrap");
    const total=Number(wrap.dataset.total||0);
    if(!total)return;
    const aisleEl=wrap.querySelector(".aisle");
    const trackHeight=aisleEl.clientHeight-24; // leave room for the walker's own height
    const progress=pinProgress(spacer, sticky);
    const elapsed=progress*total;

    wrap.querySelectorAll(".walker").forEach(w=>{
      const delay=Number(w.dataset.start), dur=Number(w.dataset.dur), reverse=w.dataset.reverse==="1";
      let local=(elapsed-delay)/dur;
      local=Math.min(1, Math.max(0, local));
      // Forward (processional): bottom (Entrance) -> top (Altar).
      // Reverse (recessional): top (Altar) -> bottom (Entrance).
      const y=(reverse?local:(1-local))*trackHeight;
      const bob=(local>0&&local<1)?Math.sin(local*Math.PI*8)*2:0;
      const fadeIn=Math.min(1, local/0.08);
      const fadeOut=Math.min(1, (1-local)/0.08);
      const opacity=(local<=0||local>=1)?0:Math.min(fadeIn,fadeOut);
      w.style.transform=`translateY(${y+bob}px)`;
      w.style.opacity=opacity;
    });
    wrap.querySelectorAll(".aisle-timeline li").forEach(li=>{
      const w=wrap.querySelector(`.walker[data-id="${li.dataset.id}"]`);
      const delay=Number(w.dataset.start), dur=Number(w.dataset.dur);
      const local=(elapsed-delay)/dur;
      li.classList.toggle("active", local>=0 && local<=1);
    });
  });
}

let aisleLoopStarted=false;
function startAisleScrollLoop(){
  if(aisleLoopStarted)return;
  aisleLoopStarted=true;
  function tick(){ updateAislePositions(); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}

function renderView(){
  const el=document.getElementById("timeline");
  if(!data.moments.length){el.innerHTML='<p style="text-align:center;color:var(--muted)">No moments yet.</p>';}
  else{
    el.innerHTML=data.moments.map(m=>{
      const hasAisle=isProcessional(m.title)||isRecessional(m.title);
      // The rail header (time/dot/h2) is never moved or restyled — same
      // element, same position, always. For processional/recessional it
      // additionally gets position:sticky (see .rail-sticky) so it's the
      // thing that stays pinned at top through the whole aisle pin, stacked
      // above the diagram's own pin rather than replaced by it.
      return `
      <div class="moment">
        <div class="${hasAisle?"rail-sticky":""}">
          <div class="time">${esc(m.time)}</div>
          <div class="dot"></div>
          <h2>${esc(m.title)}</h2>
          ${m.description?`<p>${esc(m.description)}</p>`:""}
          ${m.participants?`<div class="participants">${esc(m.participants)}</div>`:""}
        </div>
        ${isProcessional(m.title)?aisleHTML(data.processionalOrder,false):isRecessional(m.title)?aisleHTML(data.recessionalOrder,true):""}
      </div>
    `;
    }).join("")+`
      <div class="moment end-of-timeline">
        <div class="dot"></div>
        <h2>End</h2>
      </div>
    `;
  }
  document.getElementById("addBar").style.display="none";
  observeMoments();
}

// Dispatches to the right render function for whichever tab is active,
// in the right mode (view/edit) — the single entry point used by save(),
// tab switching, and initial load, so those call sites don't each need to
// know which tab is showing.
function render(){
  document.getElementById("timeline").style.display=activeTab==="timeline"?"block":"none";
  document.getElementById("speeches").style.display=activeTab==="speeches"?"block":"none";
  document.getElementById("script").style.display=activeTab==="script"?"block":"none";
  document.getElementById("addBar").style.display="none";
  document.getElementById("addSpeechBar").style.display="none";
  document.getElementById("addScriptBar").style.display="none";
  if(activeTab==="timeline"){
    editing?renderEdit():renderView();
  }else if(activeTab==="speeches"){
    editing?renderSpeechesEdit():renderSpeechesView();
  }else{
    editing?renderScriptEdit():renderScriptView();
  }
}

function renderScriptView(){
  const el=document.getElementById("script");
  if(!scriptData.sections.length){el.innerHTML='<p style="text-align:center;color:var(--muted)">No script yet.</p>';return;}
  el.innerHTML=scriptData.sections.map(s=>`
    <div class="scriptRow">
      <h2>${esc(s.heading)}</h2>
      <p${s.body?"":' class="empty"'}>${esc(s.body)||"(no text yet)"}</p>
    </div>
  `).join("");
}

function renderScriptEdit(){
  const el=document.getElementById("script");
  el.innerHTML=scriptData.sections.map((s,i)=>`
    <div class="scriptEditRow" data-i="${i}">
      <input data-field="heading" value="${esc(s.heading)}" placeholder="Section heading">
      <textarea data-field="body" placeholder="What's said in this section...">${esc(s.body||"")}</textarea>
      <div class="rowbar">
        <button class="secondary" data-action="up" ${i===0?"disabled":""}>↑</button>
        <button class="secondary" data-action="down" ${i===scriptData.sections.length-1?"disabled":""}>↓</button>
        <button class="danger" data-action="remove">Remove</button>
      </div>
    </div>
  `).join("");
  el.querySelectorAll(".scriptEditRow").forEach(row=>{
    const i=Number(row.dataset.i);
    row.querySelectorAll("[data-field]").forEach(inp=>{
      inp.addEventListener("input",()=>{scriptData.sections[i][inp.dataset.field]=inp.value;});
    });
    row.querySelector('[data-action="remove"]').addEventListener("click",()=>{
      scriptData.sections.splice(i,1);renderScriptEdit();
    });
    row.querySelector('[data-action="up"]').addEventListener("click",()=>{
      if(i===0)return;
      [scriptData.sections[i-1],scriptData.sections[i]]=[scriptData.sections[i],scriptData.sections[i-1]];
      renderScriptEdit();
    });
    row.querySelector('[data-action="down"]').addEventListener("click",()=>{
      if(i===scriptData.sections.length-1)return;
      [scriptData.sections[i+1],scriptData.sections[i]]=[scriptData.sections[i],scriptData.sections[i+1]];
      renderScriptEdit();
    });
  });
  document.getElementById("addScriptBar").style.display="block";
}

function renderSpeechesView(){
  const el=document.getElementById("speeches");
  if(!speechesData.speeches.length){el.innerHTML='<p style="text-align:center;color:var(--muted)">No speeches yet.</p>';return;}
  el.innerHTML=speechesData.speeches.map(s=>`
    <div class="speechRow">
      <h2>${esc(s.speaker)}</h2>
      ${s.relation?`<div class="relation">${esc(s.relation)}</div>`:""}
      ${s.notes?`<p>${esc(s.notes)}</p>`:""}
    </div>
  `).join("");
}

function renderSpeechesEdit(){
  const el=document.getElementById("speeches");
  el.innerHTML=speechesData.speeches.map((s,i)=>`
    <div class="speechEditRow" data-i="${i}">
      <input data-field="speaker" value="${esc(s.speaker)}" placeholder="Speaker">
      <input data-field="relation" value="${esc(s.relation||"")}" placeholder="Relation (e.g. Best Man)">
      <textarea data-field="notes" placeholder="Notes">${esc(s.notes||"")}</textarea>
      <div class="rowbar">
        <button class="secondary" data-action="up" ${i===0?"disabled":""}>↑</button>
        <button class="secondary" data-action="down" ${i===speechesData.speeches.length-1?"disabled":""}>↓</button>
        <button class="danger" data-action="remove">Remove</button>
      </div>
    </div>
  `).join("");
  el.querySelectorAll(".speechEditRow").forEach(row=>{
    const i=Number(row.dataset.i);
    row.querySelectorAll("[data-field]").forEach(inp=>{
      inp.addEventListener("input",()=>{speechesData.speeches[i][inp.dataset.field]=inp.value;});
    });
    row.querySelector('[data-action="remove"]').addEventListener("click",()=>{
      speechesData.speeches.splice(i,1);renderSpeechesEdit();
    });
    row.querySelector('[data-action="up"]').addEventListener("click",()=>{
      if(i===0)return;
      [speechesData.speeches[i-1],speechesData.speeches[i]]=[speechesData.speeches[i],speechesData.speeches[i-1]];
      renderSpeechesEdit();
    });
    row.querySelector('[data-action="down"]').addEventListener("click",()=>{
      if(i===speechesData.speeches.length-1)return;
      [speechesData.speeches[i+1],speechesData.speeches[i]]=[speechesData.speeches[i],speechesData.speeches[i+1]];
      renderSpeechesEdit();
    });
  });
  document.getElementById("addSpeechBar").style.display="block";
}

function renderEdit(){
  const el=document.getElementById("timeline");
  el.innerHTML=data.moments.map((m,i)=>`
    <div class="editRow" data-i="${i}">
      <input class="time-input" data-field="time" value="${esc(m.time)}" placeholder="Time">
      <div style="padding-left:0">
        <input data-field="title" value="${esc(m.title)}" placeholder="Title">
        <textarea data-field="description" placeholder="Description">${esc(m.description||"")}</textarea>
        <input data-field="participants" value="${esc(m.participants||"")}" placeholder="Participants">
        <div class="rowbar">
          <button class="danger" data-action="remove">Remove</button>
        </div>
      </div>
    </div>
  `).join("");
  el.querySelectorAll(".editRow").forEach(row=>{
    const i=Number(row.dataset.i);
    row.querySelectorAll("[data-field]").forEach(inp=>{
      inp.addEventListener("input",()=>{data.moments[i][inp.dataset.field]=inp.value;});
    });
    row.querySelector('[data-action="remove"]').addEventListener("click",()=>{
      data.moments.splice(i,1);renderEdit();
    });
  });
  for(const cfg of ORDER_LISTS){
    el.insertAdjacentHTML("beforeend", orderEditHTML(cfg));
    wireOrderEdit(el,cfg);
  }
  document.getElementById("addBar").style.display="block";
}

// Processional and recessional orders are the same shape and the same
// editing behavior — one parameterized pair of functions for both instead
// of two near-identical copies (see ORDER_LISTS below for the two configs).
const ORDER_LISTS=[
  {key:"processionalOrder",idPrefix:"proc",heading:"Processional order (who walks in, and when — seconds after the processional starts)"},
  {key:"recessionalOrder",idPrefix:"rec",heading:"Recessional order (who walks out, and when — seconds after the recessional starts)"},
];

function orderEditHTML({key,idPrefix,heading}){
  const order=data[key]||[];
  const rows=order.map((p,i)=>`
    <div class="procEditRow" data-i="${i}">
      <input class="p-start" data-field="startAt" type="number" min="0" step="1" value="${p.startAt}" placeholder="Sec">
      <input class="p-emoji" data-field="emoji" value="${esc(p.emoji||"")}" placeholder="🚶">
      <input class="p-name" data-field="name" value="${esc(p.name)}" placeholder="Name">
      <input class="p-role" data-field="role" value="${esc(p.role||"")}" placeholder="Role (optional)">
      <button class="danger" data-action="removeP">×</button>
    </div>
  `).join("");
  return `
    <div class="editRow">
      <div style="padding-left:0">
        <h2 style="font-size:14px;margin:0 0 8px">${esc(heading)}</h2>
        <div id="${idPrefix}Rows">${rows}</div>
        <div class="rowbar"><button class="secondary" id="add${idPrefix[0].toUpperCase()+idPrefix.slice(1)}" style="width:auto">+ Add person</button></div>
      </div>
    </div>
  `;
}

function wireOrderEdit(el,{key,idPrefix}){
  if(!data[key])data[key]=[];
  const rowsEl=el.querySelector(`#${idPrefix}Rows`);
  rowsEl.querySelectorAll(".procEditRow").forEach(row=>{
    const i=Number(row.dataset.i);
    row.querySelectorAll("[data-field]").forEach(inp=>{
      inp.addEventListener("input",()=>{
        const val=inp.dataset.field==="startAt"?Number(inp.value)||0:inp.value;
        data[key][i][inp.dataset.field]=val;
      });
    });
    row.querySelector('[data-action="removeP"]').addEventListener("click",()=>{
      data[key].splice(i,1);renderEdit();
    });
  });
  const addBtn=el.querySelector(`#add${idPrefix[0].toUpperCase()+idPrefix.slice(1)}`);
  if(addBtn)addBtn.addEventListener("click",()=>{
    const nextStart=data[key].length
      ? Math.max(...data[key].map(p=>p.startAt))+8
      : 0;
    data[key].push({id:(data.nextId||1),name:"",role:"",emoji:"🚶",startAt:nextStart});
    data.nextId=(data.nextId||1)+1;
    renderEdit();
  });
}

function observeMoments(){
  // Fade/slide-in reveal for moment text stays IntersectionObserver-driven
  // (a one-time trigger is right for that). The aisle walkers are separate —
  // scroll-linked continuously via startAisleScrollLoop(), not gated by
  // whether the moment has "become visible" yet.
  const io=new IntersectionObserver(entries=>{
    for(const e of entries)if(e.isIntersecting)e.target.classList.add("visible");
  },{threshold:.2});
  document.querySelectorAll(".moment").forEach(m=>io.observe(m));
  if(document.querySelector(".aisle-pin-spacer")){
    layoutAislePins();
    startAisleScrollLoop();
    window.addEventListener("resize", layoutAislePins);
  }
  layoutEndPadding();
  window.addEventListener("resize", layoutEndPadding);
}

// Ceremony (moments/processional/recessional) and speeches are two separate
// Drive files/routes now — save() saves whichever tab is currently active,
// against that tab's own endpoint/revisionId.
async function save(){
  const path=TAB_PATHS[activeTab];
  const body=activeTab==="speeches"?{data:speechesData,revisionId:speechesRevisionId}
    :activeTab==="script"?{data:scriptData,revisionId:scriptRevisionId}
    :{data,revisionId};
  const res=await api(path,{method:"PUT",body:JSON.stringify(body)});
  if(res.ok){
    const resBody=await res.json();
    if(activeTab==="speeches")speechesRevisionId=resBody.revisionId;
    else if(activeTab==="script")scriptRevisionId=resBody.revisionId;
    else revisionId=resBody.revisionId;
    editing=false;
    document.getElementById("editToggle").textContent="Edit";
    render();
    return;
  }
  if(res.status===409){
    alert("Someone else saved changes. Reloading the current version.");
    if(activeTab==="speeches")await loadSpeeches();
    else if(activeTab==="script")await loadScript();
    else await loadCeremony();
    editing=false;
    document.getElementById("editToggle").textContent="Edit";
    render();
    return;
  }
  alert("Save failed — check your connection and try again.");
}

async function openHistory(){
  const overlay=document.getElementById("history");
  overlay.hidden=false;
  const box=document.getElementById("historyList");
  box.innerHTML='<p class="hist-empty">Loading…</p>';
  const path=TAB_PATHS[activeTab];
  const res=await api(`${path}/revisions`);
  if(!res.ok){box.innerHTML='<p class="hist-empty">Couldn\'t load history — try again.</p>';return;}
  const {revisions}=await res.json();
  if(!revisions.length){box.innerHTML='<p class="hist-empty">No past saves yet.</p>';return;}
  box.innerHTML="";
  for(const r of revisions){
    const row=document.createElement("div");row.className="hist-row";
    row.innerHTML=`<span class="hist-when">${r.keepForever?"📌 ":""}${esc(fmtRev(r.modifiedTime))}</span>`+
      `<button class="secondary" data-id="${esc(r.id)}">Compare with current</button>`;
    row.querySelector("button").addEventListener("click",()=>compareRevision(r.id));
    box.appendChild(row);
  }
}
async function compareRevision(id){
  const path=TAB_PATHS[activeTab];
  const res=await api(`${path}/revisions/${encodeURIComponent(id)}/diff`);
  if(!res.ok){
    const body=await res.json().catch(()=>null);
    alert(body&&body.error?body.error:"Couldn't load that comparison — try again.");
    return;
  }
  const {changes}=await res.json();
  alert(changes.length?"Changes since that save:\n\n"+changes.map(c=>"• "+c).join("\n"):"No changes since that save.");
}

function setupControls(){
  if(session && session.role==="editor"){
    document.getElementById("editControls").style.display="inline";
  }
  if(session){
    document.getElementById("historyBtn").style.display="inline";
  }
  document.getElementById("editToggle").addEventListener("click",async ()=>{
    if(!editing){
      editing=true;
      document.getElementById("editToggle").textContent="Save";
      render();
    }else{
      await save();
    }
  });
  document.getElementById("addMoment").addEventListener("click",()=>{
    data.moments.push({id:(data.nextId||1),time:"",title:"New moment",description:"",participants:""});
    data.nextId=(data.nextId||1)+1;
    renderEdit();
  });
  document.getElementById("addSpeech").addEventListener("click",()=>{
    speechesData.speeches.push({id:(speechesData.nextId||1),speaker:"",relation:"",notes:""});
    speechesData.nextId=(speechesData.nextId||1)+1;
    renderSpeechesEdit();
  });
  document.getElementById("addScriptSection").addEventListener("click",()=>{
    scriptData.sections.push({id:(scriptData.nextId||1),heading:"New section",body:""});
    scriptData.nextId=(scriptData.nextId||1)+1;
    renderScriptEdit();
  });
  const tabButtons={timeline:document.getElementById("tabTimeline"),speeches:document.getElementById("tabSpeeches"),script:document.getElementById("tabScript")};
  Object.entries(tabButtons).forEach(([tab,btn])=>{
    btn.addEventListener("click",()=>{
      activeTab=tab;
      Object.entries(tabButtons).forEach(([t,b])=>b.classList.toggle("active",t===tab));
      render();
    });
  });
  document.getElementById("historyBtn").addEventListener("click",openHistory);
  const historyOverlay=document.getElementById("history");
  document.getElementById("historyClose").addEventListener("click",()=>{historyOverlay.hidden=true;});
  historyOverlay.addEventListener("click",e=>{if(e.target.id==="history")historyOverlay.hidden=true;});
  window.addEventListener("keydown",e=>{if(e.key==="Escape")historyOverlay.hidden=true;});
  const roleTag=document.getElementById("roleTag");
  if(session)roleTag.textContent=session.role;
}

async function loadConfig(){
  const config=await (await fetch("/api/config")).json();
  document.title="Ceremony"+(config.venueName?" · "+config.venueName:"");
  document.getElementById("subTitle").textContent=config.venueName||"";
}

async function init(){
  try{
    await loadConfig();
    await loadSession();
    await loadCeremony();
    await loadSpeeches();
    await loadScript();
  }catch(e){
    document.getElementById("err").textContent="Couldn't load ceremony data: "+(e&&e.message||e);
    return;
  }
  setupControls();
  render();
}
init();
</script>
